server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Laravel responses carry large headers: CSP (~2KB) + HSTS + two encrypted
    # session cookies. The default fastcgi_buffer_size 4k is too small and causes
    # nginx to return 502 Bad Gateway for routes that include all of these headers
    # simultaneously (e.g. redirect responses from the /r/{code} short-link resolver).
    fastcgi_buffer_size 16k;
    fastcgi_buffers 4 16k;

    # Allow large request bodies for file uploads (50MB)
    client_max_body_size 50M;

    # Livewire v3+ serves dynamic assets and endpoints under /livewire-{hash}/...
    # and must always be routed through Laravel instead of static file handling.
    location ^~ /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /docs/* — serve static assets (webp images) directly; all other paths
    # (e.g. /docs/, /docs/merchant/registrasi-sub-merchant) go to Laravel.
    # Without this block nginx finds public/docs/ as a real directory and
    # returns 403 before the request reaches PHP.
    location ^~ /docs {
        try_files $uri /index.php?$query_string;
    }

    # Handle all routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets with optimized headers
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
    }
}
