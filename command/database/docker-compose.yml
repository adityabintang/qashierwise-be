services:
  database:
    image: postgres:17-bookworm
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=anla
      - POSTGRES_PASSWORD=070078
      - POSTGRES_DB=qashierwise
    volumes:
      - ~/database/postgres/data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=me@anla.my.id
      - PGADMIN_DEFAULT_PASSWORD=070078
    ports:
      - "5050:80"
    volumes:
      - ~/database/postgres/admin:/var/lib/pgadmin
    depends_on:
      - database
