<!DOCTYPE html>
<html>
<head>
    <title>Test Auth dengan Custom Headers</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test dengan XHR Custom</h1>
    <button onclick="testWithXHR()">Test dengan XMLHttpRequest</button>
    <button onclick="testWithFetchFormData()">Test dengan Fetch + FormData</button>
    <button onclick="logout()">Logout & Get New Token</button>
    <pre id="result">Click button to test...</pre>

    <script>
        function testWithXHR() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const resultEl = document.getElementById('result');

            resultEl.textContent = 'Testing with XMLHttpRequest...\n';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://api.qashierwise.com/api/broadcasting/auth', true);
            xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

            xhr.onload = function() {
                resultEl.textContent += `Status: ${xhr.status}\n\n`;
                resultEl.textContent += `Response:\n${xhr.responseText}`;
            };

            xhr.onerror = function() {
                resultEl.textContent += 'Network error';
            };

            const params = `socket_id=123.456&channel_name=private-whatsapp.${user.id || 1}`;
            xhr.send(params);
        }

        function testWithFetchFormData() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const resultEl = document.getElementById('result');

            resultEl.textContent = 'Testing with Fetch + FormData...\n';

            const formData = new FormData();
            formData.append('socket_id', '123.456');
            formData.append('channel_name', `private-whatsapp.${user.id || 1}`);

            fetch('https://api.qashierwise.com/api/broadcasting/auth', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                },
                body: formData
            })
            .then(r => {
                resultEl.textContent += `Status: ${r.status}\n\n`;
                return r.text();
            })
            .then(text => {
                resultEl.textContent += `Response:\n${text}`;
            })
            .catch(e => {
                resultEl.textContent += `Error: ${e.message}`;
            });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            alert('Token cleared! Please login again.');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
